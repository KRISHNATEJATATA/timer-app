# Deploys only the dashboard/ folder to GitHub Pages. The rest of the repo
# (including data/ with the timer's log) is never published.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/deploy-dashboard.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact (dashboard only, no test files)
        run: |
          mkdir -p pages/dashboard
          cp -r dashboard/. pages/dashboard/
          rm -f pages/dashboard/test.js pages/dashboard/test-fixture.json pages/dashboard/README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dashboard
      - uses: actions/deploy-pages@v4
        id: deployment
